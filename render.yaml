services:
  - type: web
    name: boletim-backend
    env: python
    rootDir: server_python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 10000
      - key: LLM_PROVIDER
        value: ollama
      - key: OCR_ENGINE
        value: tesseract
      - key: ALLOWED_ORIGINS
        value: https://seu-frontend.vercel.app,https://seu-frontend.netlify.app

